server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 110m;  # upload dokumentov do 100 MB

    location ~ ^/(api|mcp) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;  # s portom — MCP DNS-rebinding ochrana ho overuje
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (chat stream) — bez bufferovania, inak tokeny prídu naraz na konci
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;  # SPA routing
    }
}
