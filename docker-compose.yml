# docker compose up -d   →  http://localhost:8080
#
# Prvý štart stiahne modely do volume (Ollama ~3,6 GB, embedding + reranker z Hugging Face).
# Hostovaný LLM namiesto Ollamy: RAG_LLM_PROVIDER=openai RAG_OPENAI_API_KEY=… RAG_ANSWER_MODEL=…
# (a služby ollama/ollama-pull môžeš vypnúť cez --scale ollama=0 --scale ollama-pull=0).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["sh", "-c", "ollama pull qwen3:4b-instruct && ollama pull qwen3:1.7b"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      RAG_OPENAI_BASE_URL: ${RAG_OPENAI_BASE_URL:-https://api.openai.com/v1}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-qwen3:4b-instruct}
      RAG_EXTRACT_MODEL: ${RAG_EXTRACT_MODEL:-qwen3:1.7b}
      # the container cannot see host RAM reliably — set the profile explicitly (low = smaller models)
      RAG_RAM_PROFILE: ${RAG_RAM_PROFILE:-low}
      RAG_AUTH_ENABLED: ${RAG_AUTH_ENABLED:-false}
      # the backend is reachable only through the frontend nginx, which sets X-Forwarded-For
      # → per-client login rate limit sees real client IPs
      RAG_TRUSTED_PROXY: "true"
      RAG_ADMIN_EMAIL: ${RAG_ADMIN_EMAIL:-}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-}
      RAG_COOKIE_SECURE: ${RAG_COOKIE_SECURE:-false}
      RAG_MCP_ALLOWED_HOSTS: "localhost:*,backend:*"
      RAG_OTLP_ENDPOINT: ${RAG_OTLP_ENDPOINT:-}
    volumes:
      - data:/data
      - models:/models
      - ./inbox:/data/inbox  # súbory sem nakopírované sa automaticky zaindexujú

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # Localhost only: with RAG_AUTH_ENABLED=false (the default) anyone who can reach this
      # port can read and change the whole library. To expose it on your LAN or the
      # internet, first set RAG_AUTH_ENABLED=true with RAG_ADMIN_EMAIL / RAG_ADMIN_PASSWORD,
      # add your hostname to RAG_MCP_ALLOWED_HOSTS, put it behind HTTPS (RAG_COOKIE_SECURE=true),
      # then change this to "8080:80".
      - "127.0.0.1:8080:80"

volumes:
  ollama:
  data:
  models:
